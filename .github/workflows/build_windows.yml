name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download FFmpeg & FFprobe for Windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ffmpeg
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_temp" -Force
          $binDir = Get-ChildItem -Path "ffmpeg_temp" -Directory | Select-Object -First 1
          Copy-Item "$($binDir.FullName)\bin\ffmpeg.exe" -Destination "ffmpeg\ffmpeg.exe"
          Copy-Item "$($binDir.FullName)\bin\ffprobe.exe" -Destination "ffmpeg\ffprobe.exe"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build FBPolicyShieldStudio.exe
        run: pyinstaller --noconfirm --onefile --windowed --name "FBPolicyShieldStudio" --add-binary "ffmpeg/ffmpeg.exe;ffmpeg" --add-binary "ffmpeg/ffprobe.exe;ffmpeg" --collect-all yt_dlp --hidden-import PIL.ImageTk main.py

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FBPolicyShieldStudio-Windows
          path: dist/FBPolicyShieldStudio.exe
